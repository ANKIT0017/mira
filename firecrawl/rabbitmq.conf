# RabbitMQ configuration for low memory environments
# This allows RabbitMQ to run even when host memory is low

# Set memory high watermark to a fixed value (in bytes)
# 256MB = 268435456 bytes
vm_memory_high_watermark.absolute = 268435456

# Alternatively, set a very low relative watermark
# vm_memory_high_watermark.relative = 0.1
