[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mira"
version = "1.0.0"
description = "MIRA - Autonomous Intelligent Operations Node"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["agent*", "mcp_server*", "voice*", "ui*", "scheduler*"]
